<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nest — inner dot color</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        background: #f4f6f9;
        color: #0f1b2d;
        padding: 28px 40px;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 24px;
        letter-spacing: -0.02em;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .title {
        font-weight: 600;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .chip {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1px solid #cbd5e1;
      }
      .title small {
        font-weight: 400;
        color: #64748b;
      }
      .sky,
      .dark {
        border-radius: 14px;
        height: 250px;
        display: grid;
        place-items: center;
      }
      .sky {
        background: url("sky-wallpaper.png") 50% 8% / 1389px 571px;
      }
      .dark {
        background: #0b1220;
        height: 170px;
      }
      .lock {
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #fffffc;
        filter: drop-shadow(0 6px 18px rgba(29, 72, 128, 0.35));
      }
      .lock svg {
        width: 118px;
        height: 118px;
      }
      .lock span {
        font-weight: 700;
        font-size: 56px;
        letter-spacing: -0.05em;
        line-height: 1;
        margin-top: -6px;
      }
      .dark svg {
        width: 110px;
        height: 110px;
      }
    </style>
  </head>
  <body>
    <h1>Inner dots: current mist vs subtle blues</h1>
    <div class="grid" id="grid"></div>
    <script>
      const options = [
        ["Current · Mist", "#D4E2EE"],
        ["Pale blue", "#B5D5F3"],
        ["Horizon", "#88BDE9"],
        ["Mid sky", "#649CD2"],
      ];
      const rad = (d) => (d * Math.PI) / 180;
      const pt = (r, deg) => [50 + r * Math.cos(rad(deg)), 44 + r * Math.sin(rad(deg))];
      const dot = ([x, y], r, f) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"/>`;
      const mark = (inner) =>
        `<svg viewBox="0 0 100 100">${
          Array.from({ length: 7 }, (_, i) => dot(pt(36, i * 30), 6.5, "#FFFFFC")).join("") +
          Array.from({ length: 4 }, (_, i) => dot(pt(22, 22.5 + i * 45), 5, inner)).join("") +
          '<ellipse cx="50" cy="40" rx="10" ry="12.5" fill="#FFFFFC"/>'
        }</svg>`;
      document.getElementById("grid").innerHTML = options
        .map(
          ([n, c]) => `
  <div class="col">
    <div class="title"><span class="chip" style="background:${c}"></span>${n}<small>${c}</small></div>
    <div class="sky"><div class="lock">${mark(c)}<span>nest</span></div></div>
    <div class="dark">${mark(c)}</div>
  </div>`,
        )
        .join("");
    </script>
  </body>
</html>
